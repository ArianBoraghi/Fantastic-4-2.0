<!-- Sektion 1: Deltagare & Måltider -->
<div class="form-section">
  <h2>1. DELTAGARE & MÅLTIDER</h2>
  
  <div class="form-field">
    <label for="participants">Antal deltagare för specialkost</label>
    <input type="number" id="participants" name="participants" value="0">
  </div>

  <div class="form-field">
    <label for="vegetarian">Antal vegetariska portioner</label>
    <input type="number" id="vegetarian" name="vegetarian" value="0">
  </div>

  <div class="form-field">
    <label for="vegan">Antal veganportioner</label>
    <input type="number" id="vegan" name="vegan" value="0">
  </div>

  <!-- Felmeddelande för Sektion 1 placeras HÄR -->
  <div id="portion-error" class="error-container"></div>
</div>

<!-- Sektion 2: Datum & Leverans -->
<div class="form-section">
  <h2>2. DATUM & LEVERANS</h2>

  <div class="form-field">
    <label for="conferenceDate">Konferensdatum</label>
    <input type="date" id="conferenceDate" name="conferenceDate">
  </div>

  <div class="form-field">
    <label for="deliveryDate">Leveransdatum</label>
    <input type="date" id="deliveryDate" name="deliveryDate">
  </div>

  <!-- Felmeddelande för Sektion 2 placeras HÄR -->
  <div id="date-error" class="error-container"></div>
</div>

<div class="form-actions">
  <button type="button" id="submitBtn">Skicka beställning ➔</button>
</div>

<!-- För generella fel eller framgångsmeddelande -->
<div id="general-messages"></div>
